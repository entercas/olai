[project]
name = "olai-mcp"
version = "0.1.0"
description = "Read-only MCP server over the Olai Markdown mirror"
requires-python = ">=3.11"
dependencies = ["mcp>=2.0.0"]

[project.scripts]
olai-mcp = "olai_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
