name: UI smoke test

# Runs scripts/ui-smoke/smoke.sh on a macOS release other than the one it was written
# on, against the exact disk image that will ship. A tab bar that worked on macOS 26
# was dead on 15, and the only way to know a fix holds there is to run the shipped
# binary there -- not a fresh compile on that machine's own toolchain.
#
# Point it at a release (a draft is fine, and is the intended use: test, then publish):
#   gh workflow run ui-smoke.yml -f tag=v1.3.1
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release whose Olai.dmg to test
        required: true

permissions:
  contents: write

jobs:
  smoke:
    name: macOS ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Sequoia and Tahoe: the two releases people are likely to be on.
        os: [macos-15, macos-26]

    steps:
      - uses: actions/checkout@v4

      - name: Machine
        run: sw_vers

      - name: Fetch the disk image being shipped
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ inputs.tag }}" --pattern Olai.dmg --dir "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/mnt" "$RUNNER_TEMP/app"
          hdiutil attach "$RUNNER_TEMP/Olai.dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/mnt"
          cp -R "$RUNNER_TEMP/mnt/Olai.app" "$RUNNER_TEMP/app/"
          hdiutil detach "$RUNNER_TEMP/mnt"
          # What Gatekeeper makes of it on a machine that has never seen it.
          spctl -a -vvv -t install "$RUNNER_TEMP/app/Olai.app" || true

      - name: Smoke test
        run: scripts/ui-smoke/smoke.sh "$RUNNER_TEMP/app/Olai.app" "$RUNNER_TEMP/smoke"

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: warn
